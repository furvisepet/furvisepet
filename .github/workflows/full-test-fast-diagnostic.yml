name: Full Test Fast Diagnostic

on:
  push:
    branches:
      - codex/ask-human-architecture-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: codex/ask-human-architecture-v1
      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Capture exact full-suite failures
        shell: bash
        run: |
          set +e
          npm test > /tmp/full-test.log 2>&1
          status=$?
          {
            echo "full_suite_exit=$status"
            echo "===== FAILURE BLOCKS ====="
            grep -n -B5 -A45 -E '✖|^not ok ' /tmp/full-test.log || true
            echo "===== FINAL TAIL ====="
            tail -n 100 /tmp/full-test.log
          } > full-test-fast-diagnostic.txt
          exit 0
      - name: Publish diagnostic result to branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add full-test-fast-diagnostic.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: capture fast full-test diagnostic"
            git push origin HEAD:codex/ask-human-architecture-v1
          fi
