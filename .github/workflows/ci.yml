name: Security CI
'on':
  push:
    branches:
      - main
  pull_request: null
permissions:
  contents: read
jobs:
  ask-database-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install isolated PostgreSQL test engine
        run: npm install --prefix "$RUNNER_TEMP/ask-postgres" --no-save --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8
      - name: Verify task persistence and credit-related completion boundaries
        env:
          FURVISE_PGLITE_MODULE: ${{ runner.temp }}/ask-postgres/node_modules/@electric-sql/pglite/dist/index.js
        run: node scripts/audits/ask-task-continuation.sql.mjs
      - name: Verify continuation against repository schema and triggers
        env:
          FURVISE_PGLITE_MODULE: ${{ runner.temp }}/ask-postgres/node_modules/@electric-sql/pglite/dist/index.js
        run: node scripts/audits/ask-task-continuation.sql.mjs --full-schema
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify pinned production runtime closure
        run: |
          git fetch --no-tags --depth=1 origin 4e1bb4a3a54b137cf2737094a67987f88130b541
          node scripts/export-ask-runtime-20261018.mjs --check
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Focused security tests
        env:
          NODE_OPTIONS: '--experimental-transform-types --import=${{ github.workspace }}/tests/helpers/ask-release-loader.mjs'
        run: npm run test:security
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
  full-tests:
    needs:
      - preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify pinned production runtime closure
        run: |
          git fetch --no-tags --depth=1 origin 4e1bb4a3a54b137cf2737094a67987f88130b541
          node scripts/export-ask-runtime-20261018.mjs --check
      - name: Full tests
        env:
          NODE_OPTIONS: '--experimental-transform-types --import=${{ github.workspace }}/tests/helpers/ask-release-loader.mjs'
        run: npm test -- --test-shard=${{ matrix.shard }}/4
  production-build:
    needs:
      - preflight
      - ask-database-contract
      - full-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Production build
        run: npm run build
  verify:
    needs:
      - preflight
      - ask-database-contract
      - full-tests
      - production-build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every original gate
        shell: python
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          DATABASE: ${{ needs.ask-database-contract.result }}
          FULL_TESTS: ${{ needs.full-tests.result }}
          BUILD: ${{ needs.production-build.result }}
        run: |
          import os
          results = {name: os.environ.get(name) for name in ('PREFLIGHT', 'DATABASE', 'FULL_TESTS', 'BUILD')}
          print(results)
          if any(result != 'success' for result in results.values()):
              raise SystemExit(1)
