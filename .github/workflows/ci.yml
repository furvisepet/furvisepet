name: Security CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ask-database-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install isolated PostgreSQL test engine
        run: npm install --prefix "$RUNNER_TEMP/ask-postgres" --no-save --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8
      - name: Verify task persistence and credit-related completion boundaries
        env:
          FURVISE_PGLITE_MODULE: ${{ runner.temp }}/ask-postgres/node_modules/@electric-sql/pglite/dist/index.js
        run: node scripts/audits/ask-task-continuation.sql.mjs
      - name: Verify continuation against repository schema and triggers
        env:
          FURVISE_PGLITE_MODULE: ${{ runner.temp }}/ask-postgres/node_modules/@electric-sql/pglite/dist/index.js
        run: node scripts/audits/ask-task-continuation.sql.mjs --full-schema


  ask-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      # The canonical planner is no longer a public execution path. Its retained
      # historical tests still run in the unfiltered Full tests step below.
      - name: Read-only conversation, retrieval, citations and physical-call contracts
        run: >-
          npm test -- --test-concurrency=1
          tests/test-bootstrap-loader.test.mjs
          tests/ask-read-only.test.mjs
          tests/ask-read-only-route.test.mjs
          tests/ask-emergency-preflight.test.mjs
          tests/v27-citation-proof.test.mjs
          tests/v27-citation-endpoint.test.mjs
          tests/ask-sdk-physical-attempts.test.mjs
          tests/v27-ask-two-call-limit.test.mjs
          tests/ask-credit-settlement.test.mjs
          tests/ask-admission-settlement.test.mjs
          tests/ask-restored-retry.test.mjs
          tests/furvise-brain-durable-answer-finalization.test.mjs

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Focused security tests
        run: npm run test:security
      - name: Full tests
        run: npm test
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Production build
        run: npm run build
