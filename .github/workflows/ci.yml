name: Security CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ask-database-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install isolated PostgreSQL test engine
        run: npm install --prefix "$RUNNER_TEMP/ask-postgres" --no-save --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8
      - name: Verify task persistence and credit-related completion boundaries
        env:
          FURVISE_PGLITE_MODULE: ${{ runner.temp }}/ask-postgres/node_modules/@electric-sql/pglite/dist/index.js
        run: node scripts/audits/ask-task-continuation.sql.mjs
      - name: Verify continuation against repository schema and triggers
        env:
          FURVISE_PGLITE_MODULE: ${{ runner.temp }}/ask-postgres/node_modules/@electric-sql/pglite/dist/index.js
        run: node scripts/audits/ask-task-continuation.sql.mjs --full-schema


  ask-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      # The canonical planner is no longer a public execution path. Its retained
      # historical tests still run in the unfiltered Full tests step below.
      - name: Read-only conversation, retrieval, citations and physical-call contracts
        run: >-
          npm test -- --test-concurrency=1
          tests/test-bootstrap-loader.test.mjs
          tests/ask-read-only.test.mjs
          tests/ask-read-only-reliability.test.mjs
          tests/ask-read-only-evidence-reliability.test.mjs
          tests/ask-read-only-omitted-text.test.mjs
          tests/ask-read-only-search-disclosure.test.mjs
          tests/ask-read-only-native-envelope.test.mjs
          tests/ask-citation-date.test.mjs
          tests/furvise-voice.test.mjs
          tests/ask-read-only-publication-budget.test.mjs
          tests/ask-read-only-state-claim-publication.test.mjs
          tests/ask-read-only-provider-failure-route.test.mjs
          tests/ask-read-only-dialogue-coverage.test.mjs
          tests/ask-public-cancellation-route.test.mjs
          tests/ask-input-budget-route.test.mjs
          tests/routine-year-clarification.test.mjs
          tests/furvise-conversational-architecture-v1.test.mjs
          tests/ask-provider-envelope-diagnostics.test.mjs
          tests/ask-provider-error-diagnostics.test.mjs
          tests/ask-post-review-finalizer-contract.test.mjs
          tests/canonical-care-deployment-compatibility.test.mjs
          tests/canonical-memory-suggestion.test.mjs
          tests/canonical-suggestion-continuation.test.mjs
          tests/core-loop-stability.test.mjs
          tests/ask-action-capability-v1.test.mjs
          tests/furvise-intelligence-engine.test.mjs
          tests/ask-memory-single-authority.test.mjs
          tests/ask-memory-authority-p0.test.mjs
          tests/care-entry-write-authority.test.mjs
          tests/ask-structured-output-reliability.test.mjs
          tests/ask-memory-integrity-p0.test.mjs
          tests/furvise-brain-architecture-boundary.test.mjs
          tests/furvise-brain-owner-note-gate.test.mjs
          tests/ask-error-ux.test.mjs
          tests/ask-inflight-navigation.test.mjs
          tests/navigation-data-freshness.test.mjs
          tests/public-v1-freeze.test.mjs
          tests/unified-ai-credits-care-state.test.mjs
          tests/ask-read-only-persistence.test.mjs
          tests/ask-core-invariants.test.mjs
          tests/ask-first20-reliability.test.mjs
          tests/security-phase-s1.test.mjs
          tests/ask-usage-experience.test.mjs
          tests/ask-reliability-signout.test.mjs
          tests/ask-pre-provider-retry.test.mjs
          tests/ai-credit-security-regression.test.mjs
          tests/ask-read-only-route.test.mjs
          tests/ask-read-only-actions.test.mjs
          tests/ask-emergency-preflight.test.mjs
          tests/v27-citation-proof.test.mjs
          tests/v27-citation-endpoint.test.mjs
          tests/ask-sdk-physical-attempts.test.mjs
          tests/ask-sdk-uncertainty.test.mjs
          tests/ask-full-wire-admission.test.mjs
          tests/account-entitlements.test.mjs
          tests/care-persistence-state-repair.test.mjs
          tests/ask-cross-pet-persistence-and-retry.test.mjs
          tests/v27-ask-two-call-limit.test.mjs
          tests/ask-credit-settlement.test.mjs
          tests/ask-credit-settlement-integrity.test.mjs
          tests/ask-conversation-concurrency-acceptance.test.mjs
          tests/ask-admission-settlement.test.mjs
          tests/ask-restored-retry.test.mjs
          tests/furvise-brain-durable-answer-finalization.test.mjs

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Focused security tests
        run: npm run test:security
      - name: Full tests
        run: npm test
      - name: Production dependency audit
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev --audit-level=high
      - name: Production build
        if: ${{ !cancelled() }}
        run: npm run build
