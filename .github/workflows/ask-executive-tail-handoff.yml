name: Ask Executive Tail Handoff

on:
  push:
    branches:
      - codex/ask-human-architecture-v1
    paths:
      - .github/workflows/ask-executive-tail-handoff.yml
      - tests/ask-task-execution-contract.test.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/ask-human-architecture-v1
          fetch-depth: 0
      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply executive tail handoff
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          route_path = Path('app/api/ask/route.ts')
          route = route_path.read_text()
          import_anchor = 'import { finalizeDurableAskAnswer } from "../../lib/furvise-brain/durable-answer-finalization.ts";\n'
          executive_import = 'import { finalizeAskPostReview } from "../../lib/furvise-brain/post-review-finalizer.ts";\n'
          if route.count(import_anchor) != 1:
              raise SystemExit('durable finalization import anchor mismatch')
          if executive_import not in route:
              route = route.replace(import_anchor, import_anchor + executive_import, 1)

          start_marker = '  // Requested effects finish before their task can acquire a charge disposition.\n'
          end_marker = '\n}\n\n\nfunction standaloneEmergencyResponse'
          start = route.find(start_marker)
          end = route.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('post-review tail markers not found')

          replacement = '''  // The reviewed effects above are already complete. From settlement onward,\n  // the Furvise Brain owns irreversible ordering and the only success exit.\n  return finalizeAskPostReview({\n    persistReviewedAnswer: () => assistantMessage,\n    mintActionCapabilities: () => proposedActions,\n    persistAuthorizedIntelligence: () => intelligencePersistence,\n    executeAuthorizedActions: () => ({ applicationActions, applicationStateChanged }),\n    resolveCarePresentation: () => ({ automaticCareAction, carePersistence, persistenceMode, savedSuggestion }),\n    assessTaskCompletion: () => taskExecution,\n    settleCreditDisposition: async () => {\n      let nextUsage = usage;\n      let creditsUsed = 0;\n      const incompleteTask = taskExecution.creditDisposition === "release";\n      if (creditReserved && incompleteTask) {\n        const released = await safeReleaseAiCredit({ logicalRequestId: requestId, payloadHash, requestId: creditRequestId, userId });\n        turnLifecycle.credit(released ? "released" : "release_pending").settlement("release", released ? "reconciled" : "pending");\n        nextUsage = await runOptionalAskSubsystem({\n          component: "conversation_metadata", fallback: usage,\n          operation: () => getRemainingAiCredits({ feature: "ask", monthlyAiCredits: usage.limit, planId: usage.planId, supabase, userId }),\n          onFailure: optionalFailure,\n        });\n      } else if (creditReserved) {\n        await setAiCreditDisposition({\n          disposition: "complete",\n          feature: "ask",\n          logicalRequestId: requestId,\n          payloadHash,\n          requestId: creditRequestId,\n          userId,\n        });\n        creditsUsed = 1;\n        turnLifecycle.settlement("complete", "pending");\n        try {\n          try {\n            await completeAiCredit({ feature: "ask", logicalRequestId: requestId, payloadHash, requestId: creditRequestId, userId });\n          } catch {\n            await completeAiCredit({ feature: "ask", logicalRequestId: requestId, payloadHash, requestId: creditRequestId, userId });\n          }\n          turnLifecycle.credit("completed").settlement("complete", "reconciled");\n          logAskStage("AI credit completed", { creditFinalState: "completed", creditReservationId: creditRequestId, requestId });\n        } catch (error) {\n          if (isAiCreditIntegrityError(error)) throw error;\n          turnLifecycle.credit("completion_pending").settlement("complete", "pending");\n          optionalFailure("credit_completion", error);\n        }\n        nextUsage = await runOptionalAskSubsystem({\n          component: "conversation_metadata",\n          fallback: usage,\n          operation: () => getRemainingAiCredits({ feature: "ask", monthlyAiCredits: usage.limit, planId: usage.planId, supabase, userId }),\n          onFailure: optionalFailure,\n        });\n      }\n      return { creditsUsed, nextUsage };\n    },\n    finalizeDurableAnswer: async ({ settlement }) => {\n      turnLifecycle.transition("COMPLETED");\n      const canonicalResponse = {\n        ...attachEpisodeReferences(applicationActions.length ? { ...response, applicationActions } : response, intelligenceResult?.reasoning.evidenceContract?.episodes, intelligenceResult?.reasoning),\n        turn: turnLifecycle.snapshot(),\n      };\n      const durableFallback = await finalizePersistedAskAnswer({\n        carePersistence, conversationId, messageId: assistantMessage.id,\n        responseData: canonicalResponse, requestId, supabase, userId,\n      });\n      if (durableFallback) {\n        return {\n          kind: "replay" as const,\n          response: completedResponseFromPersisted(\n            durableFallback,\n            settlement.nextUsage,\n            "Your answer is saved. Reopen the conversation to check the latest update and action status.",\n          ),\n        };\n      }\n      return { kind: "committed" as const, receipt: { canonicalResponse } };\n    },\n    invalidateCommittedState: () => {\n      if (didPersistEffectiveAskState(intelligencePersistence, carePersistence)) {\n        revalidateAskStateViews([\n          petId,\n          ...(intelligenceResult?.executionPlan.learnings.flatMap((learning) => learning.subjectType === "pet" && learning.subjectId ? [learning.subjectId] : []) || []),\n        ]);\n      }\n      if (applicationStateChanged) revalidateAskStateViews([petId]);\n      emitAskTurnTrace(turnLifecycle.snapshot(), userId, petId);\n    },\n    publishSuccess: ({ durableReceipt, settlement }) => buildSuccessfulAskResponse({\n      assistantMessageId: assistantMessage.id,\n      applicationStateChanged,\n      concern,\n      creditsUsed: settlement.creditsUsed,\n      contextUsed,\n      conversationId,\n      handledWithoutAi,\n      intelligencePersistence,\n      intelligencePersistenceWarning,\n      requestId,\n      response: durableReceipt.canonicalResponse,\n      saveMetadata,\n      safetyLevel: safetyLevel || (urgent ? "urgent" : "normal"),\n      saved: true,\n      shoppingSuppressed: shoppingSuppressed ?? Boolean(urgent),\n      suggestion: savedSuggestion,\n      carePersistence,\n      persistenceMode,\n      persistedCareAction: automaticCareAction && intelligencePersistence ? {\n        careEntryId: intelligencePersistence.persistedCareEntryId,\n        concernId: intelligencePersistence.persistedConcernId,\n      } : null,\n      usage: settlement.nextUsage,\n      userMessageId,\n      turn: turnLifecycle.snapshot(),\n    }),\n  });\n'''
          route = route[:start] + replacement + route[end:]
          if route.count('return finalizeAskPostReview({') != 1:
              raise SystemExit('executive control delegation missing or duplicated')
          route_path.write_text(route)

          test_path = Path('tests/ask-post-review-finalizer-contract.test.mjs')
          test_path.write_text('''import assert from "node:assert/strict";\nimport { readFileSync } from "node:fs";\nimport test from "node:test";\n\nconst route = readFileSync(new URL("../app/api/ask/route.ts", import.meta.url), "utf8");\n\nfunction functionSlice(name, nextName) {\n  const start = route.indexOf(`async function ${name}`);\n  assert.ok(start >= 0, `${name} exists`);\n  const end = nextName ? route.indexOf(nextName, start) : route.length;\n  assert.ok(end > start, `${name} has an end boundary`);\n  return route.slice(start, end);\n}\n\ntest("reviewed Ask effects remain ordered before the Brain tail handoff", () => {\n  const finalizer = functionSlice("persistAssistantAnswer", "function standaloneEmergencyResponse");\n  const delegate = finalizer.indexOf("return finalizeAskPostReview({");\n  assert.ok(delegate > 0);\n  const prepared = finalizer.slice(0, delegate);\n  const stages = [\n    "completeAskConversationTurn({",\n    "createActionCapabilities({",\n    "persistIntelligenceLearnings({",\n    "executeActionCapability({",\n    "resolveAutomaticCareHistoryPresentation({",\n    "assessTaskExecution({",\n  ];\n  let previous = -1;\n  for (const stage of stages) {\n    const index = prepared.indexOf(stage);\n    assert.ok(index > previous, `${stage} follows the previous reviewed effect`);\n    previous = index;\n  }\n});\n\ntest("Brain executive control owns settlement through final publication", () => {\n  const finalizer = functionSlice("persistAssistantAnswer", "function standaloneEmergencyResponse");\n  assert.match(route, /from "\\.\\.\\/\\.\\.\\/lib\\/furvise-brain\\/post-review-finalizer\\.ts"/);\n  const delegate = finalizer.slice(finalizer.indexOf("return finalizeAskPostReview({"));\n  const stages = [\n    "persistReviewedAnswer:",\n    "mintActionCapabilities:",\n    "persistAuthorizedIntelligence:",\n    "executeAuthorizedActions:",\n    "resolveCarePresentation:",\n    "assessTaskCompletion:",\n    "settleCreditDisposition:",\n    "finalizeDurableAnswer:",\n    "invalidateCommittedState:",\n    "publishSuccess:",\n  ];\n  let previous = -1;\n  for (const stage of stages) {\n    const index = delegate.indexOf(stage);\n    assert.ok(index > previous, `${stage} follows the previous Brain stage`);\n    previous = index;\n  }\n  assert.match(delegate, /settleCreditDisposition:[\\s\\S]*setAiCreditDisposition\\(/);\n  assert.match(delegate, /finalizeDurableAnswer:[\\s\\S]*finalizePersistedAskAnswer\\(/);\n  assert.match(delegate, /invalidateCommittedState:[\\s\\S]*revalidateAskStateViews\\(/);\n  assert.match(delegate, /publishSuccess:[\\s\\S]*buildSuccessfulAskResponse\\(/);\n});\n\ntest("durable replay is handed back to Brain before a second publication", () => {\n  const finalizer = functionSlice("persistAssistantAnswer", "function standaloneEmergencyResponse");\n  const delegate = finalizer.slice(finalizer.indexOf("return finalizeAskPostReview({"));\n  const durable = delegate.indexOf("finalizeDurableAnswer:");\n  const replay = delegate.indexOf('kind: "replay"', durable);\n  const invalidate = delegate.indexOf("invalidateCommittedState:", replay);\n  const publish = delegate.indexOf("publishSuccess:", invalidate);\n  assert.ok(durable >= 0 && replay > durable && invalidate > replay && publish > invalidate);\n  assert.match(delegate.slice(durable, invalidate), /completedResponseFromPersisted\\(/);\n});\n''')
          PY
      - name: Run executive handoff regressions
        run: node --test tests/ask-post-review-finalizer-contract.test.mjs tests/furvise-brain-post-review-finalizer.test.mjs tests/ask-credit-settlement.test.mjs tests/furvise-brain-durable-answer-finalization.test.mjs tests/ask-state-revalidation.test.mjs tests/ask-core-invariants.test.mjs tests/ask-pre-provider-retry.test.mjs tests/ask-usage-experience.test.mjs tests/core-loop-stability.test.mjs tests/navigation-data-freshness.test.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: Full tests
        run: npm test
      - name: Check patch
        run: git diff --check && git diff --stat
      - name: Commit verified executive tail handoff
        run: |
          git config user.name "furvisepet"
          git config user.email "furvisepet@gmail.com"
          git rm .github/workflows/ask-executive-tail-handoff.yml
          git add app/api/ask/route.ts tests/ask-post-review-finalizer-contract.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "refactor: hand Ask terminal execution to Furvise Brain"
          git push origin HEAD:codex/ask-human-architecture-v1
