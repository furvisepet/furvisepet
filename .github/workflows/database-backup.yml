name: Encrypted database backup and restore check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/database-backup.yml
      - scripts/backup/**

permissions:
  contents: read

concurrency:
  group: production-database-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out reviewed code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check required secrets without exposing them
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: python3 scripts/backup/database.py --preflight
      - name: Install database driver
        run: python3 -m pip install 'psycopg[binary]==3.2.10' 'cryptography==46.0.0'
      - name: Test encryption and source guards
        run: python3 scripts/backup/test_database.py
      - name: Pull matching Postgres distribution
        run: docker pull supabase/postgres:17.6.1.127
      - name: Back up, encrypt, and restore in an isolated container
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: python3 scripts/backup/database.py
      - name: Retain only encrypted backup
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-database-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/furvise-backup-output/*.fvbackup
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
