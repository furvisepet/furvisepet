name: Ask Executive Tail Handoff Retry

on:
  push:
    branches:
      - codex/ask-human-architecture-v1
    paths:
      - .github/workflows/ask-executive-tail-handoff-retry.yml

permissions:
  contents: write

jobs:
  patch-test-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/ask-human-architecture-v1
          fetch-depth: 0
      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Patch VM harness to load Brain finalizer
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('tests/ask-task-execution-contract.test.mjs')
          text = path.read_text()
          anchor = "const { createAnswerAssessment } = load('../app/lib/intelligence/answer-assessment.ts');\n"
          injection = "const { finalizeAskPostReview } = load('../app/lib/furvise-brain/post-review-finalizer.ts');\n"
          if anchor not in text:
              raise SystemExit('answer assessment load anchor missing')
          if injection not in text:
              text = text.replace(anchor, anchor + injection, 1)
          mock_anchor = "  const fn = routeFunction('persistAssistantAnswer', {\n    assessTaskExecution,\n"
          replacement = "  const fn = routeFunction('persistAssistantAnswer', {\n    assessTaskExecution, finalizeAskPostReview,\n"
          if mock_anchor not in text:
              raise SystemExit('persistAssistantAnswer mock anchor missing')
          text = text.replace(mock_anchor, replacement, 1)
          path.write_text(text)

          workflow = Path('.github/workflows/ask-executive-tail-handoff.yml')
          workflow_text = workflow.read_text()
          trigger = '# retry after VM harness dependency repair\n'
          if trigger not in workflow_text:
              workflow.write_text(workflow_text + '\n' + trigger)
          PY
      - name: Verify task execution harness
        run: node --test tests/ask-task-execution-contract.test.mjs
      - name: Commit harness repair and retrigger guarded handoff
        run: |
          git config user.name "furvisepet"
          git config user.email "furvisepet@gmail.com"
          git rm .github/workflows/ask-executive-tail-handoff-retry.yml
          git add tests/ask-task-execution-contract.test.mjs .github/workflows/ask-executive-tail-handoff.yml
          git diff --cached --quiet && exit 0
          git commit -m "test: load Brain finalizer in Ask execution harness"
          git push origin HEAD:codex/ask-human-architecture-v1
