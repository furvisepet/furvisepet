name: Ask Human Architecture Diagnostic

on:
  push:
    branches:
      - codex/ask-human-architecture-v1

permissions:
  contents: read

jobs:
  changed-tests:
    name: changed-tests-${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: interpretation
            tests: tests/furvise-brain-interpretation-authority.test.mjs
          - group: memory
            tests: tests/furvise-brain-memory-organ.test.mjs
          - group: working-memory
            tests: tests/furvise-brain-working-memory.test.mjs
          - group: runtime
            tests: tests/furvise-brain-ask-runtime.test.mjs
          - group: owner-note
            tests: tests/furvise-brain-owner-note-gate.test.mjs
          - group: selected-pet
            tests: tests/furvise-brain-selected-pet-anchor.test.mjs
          - group: task-gate
            tests: tests/furvise-brain-task-gate.test.mjs
          - group: task-continuation
            tests: tests/ask-task-continuation.test.mjs
          - group: followup-integration
            tests: tests/ask-working-memory-interpretation.test.mjs
          - group: publication
            tests: tests/ask-publication-receipt.test.mjs
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run changed test
        run: node --test ${{ matrix.tests }}