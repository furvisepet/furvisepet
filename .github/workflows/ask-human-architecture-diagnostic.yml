name: Ask Human Architecture Diagnostic

on:
  push:
    branches:
      - codex/ask-human-architecture-v1

permissions:
  contents: read

jobs:
  changed-tests:
    name: changed-tests-${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: authority
            tests: >-
              tests/furvise-brain-turn-authority.test.mjs
              tests/furvise-brain-subject-authority.test.mjs
              tests/furvise-brain-mutation-authorization.test.mjs
              tests/furvise-brain-action-organ.test.mjs
          - group: cognition
            tests: >-
              tests/furvise-brain-interpretation-authority.test.mjs
              tests/furvise-brain-memory-organ.test.mjs
              tests/furvise-brain-working-memory.test.mjs
              tests/furvise-brain-ask-runtime.test.mjs
          - group: integration
            tests: >-
              tests/furvise-brain-owner-note-gate.test.mjs
              tests/furvise-brain-selected-pet-anchor.test.mjs
              tests/furvise-brain-task-gate.test.mjs
              tests/ask-task-continuation.test.mjs
              tests/ask-working-memory-interpretation.test.mjs
          - group: boundary
            tests: tests/furvise-brain-architecture-boundary.test.mjs
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run changed test group
        run: node --test ${{ matrix.tests }}
