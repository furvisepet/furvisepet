name: Public V1 Freeze Gate
on:
  push:
    branches: [launch/public-v1-freeze-work, launch/public-v1-rc]
permissions:
  contents: read
jobs:
  freeze-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Public V1 focused gates
        run: >
          node --test
          tests/public-v1-freeze.test.mjs
          tests/calculation-capability.test.mjs
          tests/calculation-capability-orchestration.test.mjs
          tests/ask-post-review-finalizer-contract.test.mjs
          tests/ask-task-execution-contract.test.mjs
      - name: Security gates
        run: npm run test:security
      - name: Typecheck
        run: npm run typecheck
