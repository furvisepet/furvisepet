name: Furvise Laptop Runner Quality Qualification

on:
  push:
    branches:
      - infra/furvise-runner-first-pass-20261113
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Isolated laptop fast quality gate
    runs-on: [self-hosted, Linux, X64, furvise-ci]
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
      NODE_OPTIONS: --max-old-space-size=1792
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Focused security tests
        run: npm run test:security      - name: Full tests
        run: npm test
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Production build
        run: npm run build