name: Ask Root Regression Fix

on:
  push:
    branches:
      - codex/ask-human-architecture-v1

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ask-human-architecture-v1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply root-cause fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing in {path}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "app/lib/intelligence/generate-ask-history.ts",
              'import { planFurviseMemoryRead, retrieveFurviseMemory } from "../furvise-brain/memory-organ.ts";\n',
              'import { planFurviseMemoryRead, retrieveFurviseMemory } from "../furvise-brain/memory-organ.ts";\nimport { setFurviseMemoryAuthority } from "../furvise-brain/turn-authority.ts";\n',
          )
          replace(
              "app/lib/intelligence/generate-ask-history.ts",
              '  const brainTurn = buildAskBrainTurn({\n    context: input.context,\n    logicalTurnId: input.requestId,\n    authoritativePetIds: legacySubjectPetIds,\n  });\n',
              '  let brainTurn = buildAskBrainTurn({\n    context: input.context,\n    logicalTurnId: input.requestId,\n    authoritativePetIds: legacySubjectPetIds,\n  });\n  // Entering the server-owned historical callback is itself read authority.\n  // Some deterministic/fallback paths intentionally have no model interpretation;\n  // they must still perform the bounded history read this callback promises.\n  if (!input.context.askInterpretation?.request && !input.context.askInterpretation?.conversationOnly) {\n    brainTurn = setFurviseMemoryAuthority(brainTurn, { need: "targeted", petIds: legacySubjectPetIds });\n  }\n',
          )
          replace(
              "app/lib/intelligence/owner-note-request.ts",
              '    const commands = sentences.filter(sentence => sentence.includes(authorization));\n    if (!commands.length) return null;\n',
              '    const commands = sentences.filter(sentence => sentence.includes(authorization));\n    if (!commands.length) return null;\n    const commandIndex = sentences.findIndex(sentence => sentence.includes(authorization));\n    const commandHasCondition = commands.some(sentence => /\\b(?:if|unless)\\b/i.test(sentence));\n    const priorClauseConditionsReferencedNote = commandIndex > 0\n      && /\\b(?:if|unless)\\b/i.test(sentences[commandIndex - 1])\n      && /\\b(?:this|that)\\s+note\\b|\\bit\\b/i.test(sentences[commandIndex]);\n    // A conditional save is not durable authorization. Scope this guard to the\n    // save clause (or the clause it explicitly points back to) so an unrelated\n    // follow-up such as "tell me if..." does not suppress a valid note write.\n    if (commandHasCondition || priorClauseConditionsReferencedNote) return null;\n',
          )
          replace(
              "app/lib/intelligence/entities/recent-subject-state.ts",
              '  // An explicitly focused pet outranks stored sex/pronoun metadata. Owners may\n  // use a different pronoun, and a mere object mention must not steal focus.\n  const focused = currentFocus && (currentFocus.kind === "pet" || currentFocus.pronouns.includes(pronoun)) ? currentFocus : null;\n',
              '  // Stored sex/pronoun metadata is advisory, but an incompatible selected-pet\n  // focus may override it only when no competing compatible entity has already\n  // been an explicit discourse subject. This preserves independent pronoun\n  // chains while preventing a same-turn object mention from stealing focus.\n  const focused = currentFocus && (\n    currentFocus.pronouns.includes(pronoun)\n    || (currentFocus.kind === "pet" && currentFocus.petId === state.selectedPetId\n      && currentFocus.lastSubjectTurn >= 0\n      && !compatible.some(entity => entity !== currentFocus && entity.lastSubjectTurn >= 0))\n  ) ? currentFocus : null;\n',
          )
          replace(
              "app/lib/intelligence/entities/recent-subject-state.ts",
              '    if (mentions.length === 1) return resolved(mentions[0], mentions);\n    const selectedMention = mentions.find(entity => entity.petId === state.selectedPetId);\n    if (selectedMention) return resolved(selectedMention, mentions);\n    if (mentions.length > 1) return ambiguous(mentions);\n',
              '    if (mentions.length === 1) return resolved(mentions[0], mentions);\n    // Equally recent compatible explicit mentions are genuinely ambiguous,\n    // even when one happens to be the UI-selected pet. Selection is only the\n    // fallback when discourse itself does not present competing candidates.\n    if (mentions.length > 1) return ambiguous(mentions);\n',
          )
      - name: Verify affected behavior
        run: >-
          node --test
          tests/owner-note-write-isolation.test.mjs
          tests/ask-conversation-subject-continuity-p0.test.mjs
          tests/furvise-brain-selected-pet-anchor.test.mjs
          tests/ask-candidate-rpc-integration.test.mjs
          tests/ask-digestive-recall.test.mjs
          tests/ask-episode-history.test.mjs
      - name: Commit verified fixes and remove this temporary workflow
        shell: bash
        run: |
          rm .github/workflows/ask-root-regression-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore ask history and discourse invariants"
          git push origin HEAD:codex/ask-human-architecture-v1
