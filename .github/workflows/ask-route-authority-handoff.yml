name: Ask Route Authority Handoff

on:
  push:
    branches:
      - codex/ask-human-architecture-v1
    paths:
      - .github/workflows/ask-route-authority-handoff.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/ask-human-architecture-v1
          fetch-depth: 0
      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply asserted authority handoff
        run: python scripts/ask-route-authority-handoff.py
      - name: Verify extracted helper ownership
        run: |
          ! grep -n 'async function safeReleaseAiCredit' app/api/ask/route.ts
          ! grep -n 'async function reconcilePersistedAskCredit' app/api/ask/route.ts
          ! grep -n 'function revalidateAskStateViews' app/api/ask/route.ts
          grep -n 'createAskCreditSettlement' app/api/ask/route.ts
          grep -n 'finalizeDurableAskAnswer' app/api/ask/route.ts
          grep -n 'revalidateAskStateViews' app/api/ask/route.ts
      - name: Run handoff regression tests
        run: node --test tests/ask-credit-settlement.test.mjs tests/ask-state-revalidation.test.mjs tests/furvise-brain-durable-answer-finalization.test.mjs tests/ask-post-review-finalizer-contract.test.mjs tests/ask-task-execution-contract.test.mjs tests/navigation-data-freshness.test.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: Full tests
        shell: bash
        run: |
          set +e
          npm test > /tmp/ask-full-test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "=== COMPACT FULL-SUITE FAILURE DIAGNOSTICS ==="
            python <<'PY'
          from pathlib import Path
          lines = Path('/tmp/ask-full-test.log').read_text(errors='replace').splitlines()
          markers = []
          needles = ('✖ failing tests:', 'AssertionError', 'ReferenceError', 'TypeError', 'ERR_', 'not ok ', 'ℹ fail ')
          for index, line in enumerate(lines):
              if any(needle in line for needle in needles):
                  markers.append(index)
          windows = []
          for index in markers:
              start = max(0, index - 8)
              end = min(len(lines), index + 28)
              if windows and start <= windows[-1][1]:
                  windows[-1] = (windows[-1][0], max(windows[-1][1], end))
              else:
                  windows.append((start, end))
          if not windows:
              windows = [(max(0, len(lines) - 180), len(lines))]
          for start, end in windows[-12:]:
              print(f'--- lines {start + 1}-{end} ---')
              print('\n'.join(lines[start:end]))
          PY
          fi
          exit "$status"
      - name: Check patch
        run: git diff --check && git diff --stat
      - name: Commit verified handoff
        run: |
          git config user.name "furvisepet"
          git config user.email "furvisepet@gmail.com"
          git add app/api/ask/route.ts tests/ask-post-review-finalizer-contract.test.mjs tests/ask-task-execution-contract.test.mjs tests/navigation-data-freshness.test.mjs tests/ask-credit-settlement.test.mjs tests/furvise-brain-durable-answer-finalization.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "refactor: delegate Ask route side-effect authority"
          git push origin HEAD:codex/ask-human-architecture-v1
