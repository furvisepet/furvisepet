name: Ask Residual Regression Fix

on:
  push:
    branches:
      - codex/ask-human-architecture-v1

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ask-human-architecture-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply residual root fixes
        shell: python
        run: |
          from pathlib import Path

          def patch(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing in {path}")
              p.write_text(text.replace(old, new, 1))

          patch(
              "app/lib/intelligence/generate-ask-history.ts",
              "  const legacySubjectPetIds = input.context.askInterpretation?.conversationOnly\n"
              "    ? []\n"
              "    : input.authoritativePetIds ?? [input.context.pet.id];\n",
              "  // Legacy route/harness scope is untrusted at this boundary. Intersect it\n"
              "  // with the authenticated owner's eligible pets before the Brain turn exists.\n"
              "  // This preserves valid multi-pet reads while making foreign ids inert.\n"
              "  const ownedPetIds = new Set(input.context.eligiblePets\n"
              "    .filter(pet => pet.user_id === input.context.owner.userId)\n"
              "    .map(pet => pet.id));\n"
              "  const legacySubjectPetIds = input.context.askInterpretation?.conversationOnly\n"
              "    ? []\n"
              "    : [...new Set((input.authoritativePetIds ?? [input.context.pet.id]).filter(id => ownedPetIds.has(id)))];\n",
          )

          patch(
              "app/lib/intelligence/review-task-completion.ts",
              "  if (!request || input.validation.response.evidenceContract?.history\n"
              "    || [\"urgent\", \"emergency\"].includes(input.validation.response.intelligenceSafety.level)) return input.validation;\n",
              "  // This reviewer is the non-history complement. A saved-history request\n"
              "  // remains historical even when retrieval produced no history object; the\n"
              "  // history/evidence validator already owns deterministic limitations there.\n"
              "  if (!request || request.evidenceBasis === \"saved_history\" || input.validation.response.evidenceContract?.history\n"
              "    || [\"urgent\", \"emergency\"].includes(input.validation.response.intelligenceSafety.level)) return input.validation;\n",
          )

          patch(
              "tests/ask-memory-single-authority.test.mjs",
              "    \"./care-authority-client.ts\": { createCanonicalCareAuthorityClient: () => { throw new Error(\"Unexpected care RPC\"); } },\n",
              "    \"./care-authority-client.ts\": { createCanonicalCareAuthorityClient: () => { throw new Error(\"Unexpected care RPC\"); } },\n"
              "    \"../furvise-brain/turn-authority.ts\": { assertFurviseMutationAllowed(authority, expectedKind) {\n"
              "      assert.equal(authority?.mutation?.allowed, true);\n"
              "      assert.equal(authority?.mutation?.kind, expectedKind);\n"
              "    } },\n",
          )

          patch(
              "tests/ask-memory-single-authority.test.mjs",
              "    assistantMessageId: \"assistant\", authorizedPetIds: multi ? [\"pet-a\", \"pet-b\"] : [\"pet-a\"], careActions: care ? [{ action: \"log_care\", title: \"Walk\", details: \"Walk\" }] : [],\n"
              "    learnings: multi ? [learning, { ...learning, subjectId: \"pet-b\" }] : [learning], currentMessage: \"Evening walks\", operationOwnerToken: \"test-lease\", payloadHash: \"test-hash\",\n",
              "    assistantMessageId: \"assistant\", authorizedPetIds: multi ? [\"pet-a\", \"pet-b\"] : [\"pet-a\"],\n"
              "    careActions: care ? [{ action: \"create_entry\", category: \"routine\", title: \"Walk\", details: \"Walk\", severity: \"routine\", confidence: 1, relatedRecordId: null }] : [],\n"
              "    careWriteAuthority: care ? {\n"
              "      version: \"furvise-brain-turn.v1\", logicalTurnId: \"request\",\n"
              "      subject: { petIds: multi ? [\"pet-a\", \"pet-b\"] : [\"pet-a\"], kind: multi ? \"multi_pet\" : \"pet\", label: null, source: \"conversation\", unresolved: false },\n"
              "      intent: \"record\", memoryNeed: \"working\", memoryPetIds: [],\n"
              "      mutation: { allowed: true, kind: \"record_care\", userAuthorizationVerified: true, authorizationSource: \"current_turn\", authorizationTurnId: \"source\", confirmationRequired: false, confirmationSatisfied: false },\n"
              "      referenceTurnIds: [],\n"
              "    } : null,\n"
              "    learnings: multi ? [learning, { ...learning, subjectId: \"pet-b\" }] : [learning], currentMessage: \"Evening walks\", operationOwnerToken: \"test-lease\", payloadHash: \"test-hash\",\n",
          )
      - name: Verify residual failures
        run: >-
          node --test
          tests/ask-memory-single-authority.test.mjs
          tests/ask-remaining-reliability.test.mjs
          tests/ask-shared-request-contract.test.mjs
      - name: Commit only verified fixes
        shell: bash
        run: |
          rm .github/workflows/ask-residual-regression-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close residual Ask authority regressions"
          git fetch origin codex/ask-human-architecture-v1
          git rebase origin/codex/ask-human-architecture-v1
          git push origin HEAD:codex/ask-human-architecture-v1
