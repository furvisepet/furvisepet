name: Trusted Release CI

on:
  push:
    branches: [release/journal-first-20261116]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed release commit
        required: true
        type: string
      validation_scope:
        description: Targeted by default; full validation requires explicit dispatch
        required: true
        type: choice
        default: targeted
        options: [targeted, full]

permissions:
  contents: read

concurrency:
  group: furvise-ci-trusted-release
  cancel-in-progress: false

jobs:
  trusted-release:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'full' && 'Trusted release checks (full)' || 'Targeted release checks' }}
    if: >-
      github.repository == 'furvisepet/furvisepet' &&
      github.actor == 'furvisepet' &&
      github.ref == 'refs/heads/release/journal-first-20261116' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Linux, X64, furvise-ci]
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'full' && 25 || 3 }}
    env:
      NODE_OPTIONS: --max-old-space-size=1536
      UV_THREADPOOL_SIZE: "2"
      FURVISE_AI_ENABLED: "false"
      FURVISE_AI_ASK_ENABLED: "false"
      FURVISE_AI_MEMORY_EXTRACTION_ENABLED: "false"
      OPENAI_API_KEY: ""
      VERCEL_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify existing runner and hard resource bounds
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
          VALIDATION_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'full' && 'full' || 'targeted' }}
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "furvise-grok-v16-ci"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          memory_max=$(cat /sys/fs/cgroup/memory.max)
          read -r cpu_quota cpu_period < /sys/fs/cgroup/cpu.max
          [[ "$memory_max" =~ ^[0-9]+$ ]]
          [[ "$cpu_quota" =~ ^[0-9]+$ ]]
          [[ "$cpu_period" =~ ^[0-9]+$ ]]
          test "$memory_max" -le 3221225472
          test "$memory_max" -ge 2147483648
          test "$cpu_period" -gt 0
          test "$cpu_quota" -le "$((cpu_period * 2))"
          if [ "$VALIDATION_SCOPE" = targeted ]; then
            test "$(awk '/MemAvailable/ {print $2}' /proc/meminfo)" -ge 2097152
          fi
          printf 'Reviewed SHA: %s; memory cap: %s; CPU quota/period: %s/%s\n' "$GITHUB_SHA" "$memory_max" "$cpu_quota" "$cpu_period"
      - name: Check out exact trusted commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Use reviewed Node 24 patch
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - name: Install locked dependencies without lifecycle scripts
        id: locked-dependencies
        env:
          NODE_OPTIONS: --max-old-space-size=384
        run: timeout --signal=TERM --kill-after=5s 75s npm ci --ignore-scripts --no-audit --no-fund --maxsockets=1
      # Prove fresh migration replay before independent app checks; never waive it.
      - name: Repaired fixture subset (24 tests)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'full' }}
        timeout-minutes: 2
        env:
          NODE_OPTIONS: --max-old-space-size=384
          UV_THREADPOOL_SIZE: "1"
        run: |
          set -euo pipefail
          command -v taskset
          cpu=$(awk '/Cpus_allowed_list/ {print $2}' /proc/self/status)
          cpu=${cpu%%[-,]*}
          [[ "$cpu" =~ ^[0-9]+$ ]]
          timeout --signal=TERM --kill-after=5s 90s taskset -c "$cpu" node --jitless --import ./scripts/audits/offline-network-guard.mjs --import ./tests/helpers/register-release-typescript.mjs --test --test-concurrency=1 --test-reporter=tap tests/care-log.test.mjs tests/care-update-intent-lifecycle.test.mjs tests/care-workspace-stale-callback.test.mjs tests/ask-availability-route-fixture.test.mjs
      - name: Install isolated database contract engine
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'full' }}
        run: npm install --prefix "$RUNNER_TEMP/furvise-postgres" --no-save --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8
      - name: Existing database contracts, serial and disposable
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'full' }}
        env:
          FURVISE_PGLITE_MODULE: ${{ runner.temp }}/furvise-postgres/node_modules/@electric-sql/pglite/dist/index.js
        run: |
          node --import ./scripts/audits/offline-network-guard.mjs scripts/audits/ask-task-continuation.sql.mjs
          node --import ./scripts/audits/offline-network-guard.mjs scripts/audits/ask-task-continuation.sql.mjs --full-schema
          node --import ./scripts/audits/offline-network-guard.mjs scripts/audits/ask-task-continuation.sql.mjs --full-schema --v2
          node --import ./scripts/audits/offline-network-guard.mjs scripts/audits/ask-task-migration-recovery.sql.mjs

      - name: TypeScript
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'full' }}
        run: npm run typecheck
      - name: Journal and public-notes release regressions
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'full' }}
        run: npm run test:release
      - name: Existing focused security selection with external fetch blocked
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'full' }}
        run: node scripts/check-security-release.mjs
      - name: Production dependency audit
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'full' }}
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'full' }}
        run: |
          ulimit -c 0
          npm run lint
      - name: Production build with two Next workers
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'full' }}
        env:
          NODE_OPTIONS: --max-old-space-size=1024
        run: |
          trap 'result=$?; cat /sys/fs/cgroup/memory.events; cat /sys/fs/cgroup/memory.peak; exit "$result"' EXIT
          cat /sys/fs/cgroup/memory.events
          npm run build
      - name: Verify built public notes and zero-provider disabled state
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'full' }}
        run: node scripts/check-release-notes-http.mjs
      - name: Bounded full source suite without provider access
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'full' && !cancelled() && steps.locked-dependencies.outcome == 'success' }}
        run: |
          timeout --signal=TERM --kill-after=15s 600s node --jitless --import ./scripts/audits/offline-network-guard.mjs --import ./tests/helpers/register-release-typescript.mjs --test --test-concurrency=1 --test-reporter=tap
