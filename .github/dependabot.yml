version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Vancouver
    open-pull-requests-limit: 5
    groups:
      production-patch-and-minor:
        dependency-type: production
        update-types:
          - patch
          - minor
      development-patch-and-minor:
        dependency-type: development
        update-types:
          - patch
          - minor
